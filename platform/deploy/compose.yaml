name: ai4s-${AI4S_ENV:?Set a unique environment}
x-backend: &backend
  build: {context: ../backend, dockerfile: Dockerfile}
  environment:
    AI4S_ENV: ${AI4S_ENV:?required}
    AI4S_SECRET_KEY: ${AI4S_SECRET_KEY:?required}
    AI4S_ALLOWED_HOSTS: ${AI4S_ALLOWED_HOSTS:?required}
    AI4S_DB_ENGINE: django.db.backends.postgresql
    AI4S_DB_NAME: ai4s_${AI4S_ENV}
    AI4S_DB_USER: ai4s
    AI4S_DB_PASSWORD: ${AI4S_DB_PASSWORD:?required}
    AI4S_DB_HOST: db
    AI4S_DB_PORT: 5432
    AI4S_FILES_ROOT: /srv/private/${AI4S_ENV}
    AI4S_BROKER_URL: amqp://ai4s:${AI4S_BROKER_PASSWORD:?required}@broker:5672/ai4s_${AI4S_ENV}
    AI4S_BROKER_PASSWORD: ${AI4S_BROKER_PASSWORD:?required}
  volumes: [private-files:/srv/private]
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ai4s_${AI4S_ENV}
      POSTGRES_USER: ai4s
      POSTGRES_PASSWORD: ${AI4S_DB_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U ai4s -d "$$POSTGRES_DB"'], interval: 5s, timeout: 5s, retries: 12}
  broker:
    image: rabbitmq:4.3.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ai4s
      RABBITMQ_DEFAULT_PASS: ${AI4S_BROKER_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: ai4s_${AI4S_ENV}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 10s, timeout: 10s, retries: 12}
  migrate:
    <<: *backend
    command: [migrate]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"
  api:
    <<: *backend
    depends_on: {migrate: {condition: service_completed_successfully}, broker: {condition: service_healthy}}
  worker:
    <<: *backend
    command: [celery, -A, config.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on: {migrate: {condition: service_completed_successfully}, broker: {condition: service_healthy}}
  web:
    build: {context: ../frontend, dockerfile: Dockerfile}
    ports: ["${AI4S_HTTPS_PORT:-443}:8443"]
    depends_on: [api]
    secrets:
      - {source: tls_crt, target: tls.crt}
      - {source: tls_key, target: tls.key}
secrets:
  tls_crt: {environment: AI4S_TLS_CERTIFICATE}
  tls_key: {environment: AI4S_TLS_PRIVATE_KEY}
volumes: {postgres-data: {}, rabbit-data: {}, private-files: {}}
