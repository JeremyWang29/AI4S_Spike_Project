server { listen 8443 ssl; server_name _; ssl_certificate /run/secrets/tls.crt; ssl_certificate_key /run/secrets/tls.key;
  root /usr/share/nginx/html; location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
}
